name: Developer Mode Build & Test

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build_and_test:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v3

    - name: Set up Python 3.10
      uses: actions/setup-python@v4
      with:
        python-version: '3.10'

    - name: Cache pip dependencies
      uses: actions/cache@v4
      with:
        path: ~/.cache/pip
        key: ${{ runner.os }}-pip-${{ hashFiles('**/requirements.txt') }}-3.10
        restore-keys: |
          ${{ runner.os }}-pip-

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements-dev.txt
        pip install -e ".[export-onnx]"

    - name: Install pre-commit
      run: pip install pre-commit

    - name: Cache pre-commit environment
      uses: actions/cache@v4
      with:
        path: ~/.cache/pre-commit
        key: ${{ runner.os }}-precommit-${{ hashFiles('**/.pre-commit-config.yaml') }}
        restore-keys: |
          ${{ runner.os }}-precommit-

    - name: Run pre-commit hooks
      run: pre-commit run --all-files --show-diff-on-failure

    - name: Test with pytest
      run: |
        pip install pytest pytest-cov
        pytest --cov=yolo

  tflite_export:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      OMP_NUM_THREADS: '2'
      MKL_NUM_THREADS: '2'

    steps:
    - name: Checkout repository
      uses: actions/checkout@v3

    - name: Set up Python 3.12
      uses: actions/setup-python@v4
      with:
        python-version: '3.12'

    - name: Install TFLite export dependencies
      run: |
        python -m pip install --upgrade uv
        uv pip install --python python --torch-backend cpu -e ".[export-tflite]" pytest
        uv pip check --python python

    - name: Require TFLite backend imports
      run: python -c "import litert_torch; from ai_edge_litert.interpreter import Interpreter"

    - name: Test TFLite conversion and runtime parity
      run: >-
        python -m pytest tests/test_tools/test_export.py
        tests/test_tools/test_pose_export.py -k tflite -q -rs
