[project]
name = "yolo"
version = "0.1.0"
dynamic = ["dependencies"]
description = "Official Implementation of YOLO"
authors = [
    { name = "Hao-Tang, Tsui", email = "henrytsui000@gmail.com" },
]
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.10"
keywords = ["yolo", "object detection", "computer vision"]


[tool.setuptools.dynamic]
dependencies = {file = ["requirements.txt"]}

[tool.setuptools.packages.find]
where = ["."]
include = ["yolo*"]

[tool.setuptools]
package-data = {"yolo" = ["**/*.yaml"]}
include-package-data = true


[build-system]
build-backend = "setuptools.build_meta"
requires = [
    "setuptools",
]

[project.scripts]
yolo = "yolo.lazy:main"

[project.optional-dependencies]
export-onnx = ["onnx>=1.16", "onnxruntime>=1.18"]
# Keep the converter and its PyTorch/TorchAO stack reproducible in a separate
# export environment; these pins do not affect the base training installation.
export-tflite = [
    "litert-torch==0.10.0",
    "ai-edge-litert[model-utils]==2.3.0",
    "torch==2.14.1",
    "torchvision==0.29.1",
    "torchao==0.18.0",
    # LiteRT depends on this unconditionally; 1.3.1 only supports Python <3.11.
    "backports-strenum==1.2.8",
]
