# Inherit the detection model's backbone, neck and FPN head.
defaults:
  - v9-c
  - _self_

name: v9-c-pose

# Signed coordinate distributions, in stride units from each grid center.
pose:
  num_keypoints: 17
  pose_bins: 64
  pose_range: 32.0

model:
  detection:
    - MultiheadPose:
        source: [P3, P4, P5]
        tags: Main
        output: True

# Hydra replaces lists, so retain all auxiliary feature layers explicitly.
  auxiliary:
    - CBLinear:
        source: B3
        args: {out_channels: [256]}
        tags: R3
    - CBLinear:
        source: B4
        args: {out_channels: [256, 512]}
        tags: R4
    - CBLinear:
        source: B5
        args: {out_channels: [256, 512, 512]}
        tags: R5

    - Conv:
        args: {out_channels: 64, kernel_size: 3, stride: 2}
        source: 0
    - Conv:
        args: {out_channels: 128, kernel_size: 3, stride: 2}
    - RepNCSPELAN:
        args: {out_channels: 256, part_channels: 128}

    - ADown:
        args: {out_channels: 256}
    - CBFuse:
        source: [R3, R4, R5, -1]
        args: {index: [0, 0, 0]}
    - RepNCSPELAN:
        args: {out_channels: 512, part_channels: 256}
        tags: A3

    - ADown:
        args: {out_channels: 512}
    - CBFuse:
        source: [R4, R5, -1]
        args: {index: [1, 1]}
    - RepNCSPELAN:
        args: {out_channels: 512, part_channels: 512}
        tags: A4

    - ADown:
        args: {out_channels: 512}
    - CBFuse:
        source: [R5, -1]
        args: {index: [2]}
    - RepNCSPELAN:
        args: {out_channels: 512, part_channels: 512}
        tags: A5

    - MultiheadPose:
        source: [A3, A4, A5]
        tags: AUX
        output: True
