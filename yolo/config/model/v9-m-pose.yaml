# Inherit the detection model's backbone, neck and FPN head.
defaults:
  - v9-m
  - _self_

name: v9-m-pose

# Signed coordinate distributions, in stride units from each grid center.
pose:
  num_keypoints: 17
  pose_bins: 64
  pose_range: 32.0

model:
  detection:
    - MultiheadPose:
        source: [P3, P4, P5]
        tags: Main
        output: True

# Hydra replaces lists, so retain all auxiliary feature layers explicitly.
  auxiliary:
    - CBLinear:
        source: B3
        args: {out_channels: [240]}
        tags: R3
    - CBLinear:
        source: B4
        args: {out_channels: [240, 360]}
        tags: R4
    - CBLinear:
        source: B5
        args: {out_channels: [240, 360, 480]}
        tags: R5

    - Conv:
        args: {out_channels: 32, kernel_size: 3, stride: 2}
        source: 0
    - Conv:
        args: {out_channels: 64, kernel_size: 3, stride: 2}
    - RepNCSPELAN:
        args: {out_channels: 128, part_channels: 128}

    - AConv:
        args: {out_channels: 240}
    - CBFuse:
        source: [R3, R4, R5, -1]
        args: {index: [0, 0, 0]}
    - RepNCSPELAN:
        args: {out_channels: 240, part_channels: 240}
        tags: A3

    - AConv:
        args: {out_channels: 360}
    - CBFuse:
        source: [R4, R5, -1]
        args: {index: [1, 1]}
    - RepNCSPELAN:
        args: {out_channels: 360, part_channels: 360}
        tags: A4

    - AConv:
        args: {out_channels: 480}
    - CBFuse:
        source: [R5, -1]
        args: {index: [2]}
    - RepNCSPELAN:
        args: {out_channels: 480, part_channels: 480}
        tags: A5

    - MultiheadPose:
        source: [A3, A4, A5]
        tags: AUX
        output: True
