task: train

defaults:
  - validation: ../validation-pose

epoch: 500
gradient_clip_val: 10.0
gradient_clip_algorithm: norm

data:
  batch_size: 16
  equivalent_batch_size: 64
  image_size: ${image_size}
  resize_mode: ${resize_mode}
  cpu_num: ${cpu_num}
  shuffle: true
  pin_memory: true
  dynamic_shape: false
  data_augment:
    Pose:
      fliplr: 0.5
      degrees: 10.0
      translate: 0.1
      scale: 0.2
      hsv_h: 0.015
      hsv_s: 0.4
      hsv_v: 0.4

optimizer:
  type: SGD
  args:
    lr: 0.01
    weight_decay: 0.0005
    momentum: 0.937
    nesterov: true

loss:
  # null selects official COCO-17 sigmas; custom layouts must supply every sigma.
  oks_sigmas: null
  objective:
    BCELoss: 0.5
    BoxLoss: 7.5
    DFLoss: 1.5
    PoseOKSLoss: 7.5
    PoseDFLoss: 1.0
    PoseVisibilityLoss: 1.0
  aux: 0.25
  matcher:
    iou: CIoU
    topk: 10
    factor:
      iou: 6.0
      cls: 0.5

scheduler:
  type: LinearLR
  warmup:
    epochs: 3.0
    min_iterations: 100
  args:
    total_iters: ${task.epoch}
    start_factor: 1
    end_factor: 0.01

ema:
  enable: true
  decay: 0.9999
