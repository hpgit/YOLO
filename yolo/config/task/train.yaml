task: train

defaults:
  - validation: ../validation

epoch: 500
gradient_clip_val: 10.0
gradient_clip_algorithm: norm

data:
  batch_size: 16
  equivalent_batch_size: 64
  image_size: ${image_size}
  cpu_num: ${cpu_num}
  shuffle: True
  pin_memory: True
  data_augment:
    YOLOv9:
      hsv_h: 0.015
      hsv_s: 0.7
      hsv_v: 0.4
      degrees: 0.0
      translate: 0.1
      scale: 0.9
      shear: 0.0
      perspective: 0.0
      flipud: 0.0
      fliplr: 0.5
      mosaic: 1.0
      mixup: 0.15
      copy_paste: 0.3
      # Pin the upstream-compatible package API in requirements.txt.
      albumentations: true
      # Mild motion blur, applied after geometry/photometric transforms.
      motion_blur: 0.1
      motion_blur_kernel_size: 3
      motion_blur_strength: 0.5

optimizer:
  type: SGD
  args:
    lr: 0.01
    weight_decay: 0.0005
    momentum: 0.937
    nesterov: true

loss:
  objective:
    BCELoss: 0.5
    BoxLoss: 7.5
    DFLoss: 1.5
  aux:
    0.25
  matcher:
    iou: CIoU
    topk: 10
    factor:
      iou: 6.0
      cls: 0.5

scheduler:
  type: LinearLR
  warmup:
    epochs: 3.0
    min_iterations: 100
  args:
    total_iters: ${task.epoch}
    start_factor: 1
    end_factor: 0.01

ema:
  enable: true
  decay: 0.9999
