task: validation

# auto: use COCO JSON unless the loader selects an explicit split TXT list.
# coco: require JSON; torchmetrics: explicitly retain the legacy evaluator.
evaluator: auto
# Optional absolute path, or a path relative to dataset.path.
annotation_path: null

data:
  batch_size: 32
  image_size: ${image_size}
  cpu_num: ${cpu_num}
  shuffle: False
  pin_memory: True
  data_augment: {}
  dynamic_shape: False
nms:
  min_confidence: 0.0001
  min_iou: 0.7
  max_bbox: 1000
